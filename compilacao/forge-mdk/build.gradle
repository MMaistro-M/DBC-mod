buildscript {
    repositories {
        maven {
            url = "https://repo.maven.apache.org/maven2"
        }
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = "1.0"
group= "com.tobiasmjc.dbcadditions"
archivesBaseName = "dbcadditions-patch"
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

compileJava {
    options.compilerArgs += ['-proc:none']
}

// ForgeGradle 1.2 does not propagate the normal compile configuration to
// its legacy source compiler. Keep the original mod JARs visible only while
// compiling the replacement classes.
def localModJars = fileTree(dir: 'libs', include: ['*.jar'])
sourceSets.main.compileClasspath += localModJars
sourceSets.main.runtimeClasspath += localModJars
// Decompiled classes use the 1.7.10 SRG names. Compile them against the
// matching Forge SRG artifact, rather than ForgeGradle's deobfuscated source JAR.
def srgCompileJar = file(System.properties['user.home'] + '/.gradle/caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forge-1.7.10-10.13.4.1614-1.7.10-srg.jar')
def forgeCompileJar = file(System.properties['user.home'] + '/.gradle/caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/forgeSrc-1.7.10-10.13.4.1614-1.7.10.jar')
compileJava.classpath = files(forgeCompileJar, localModJars, fileTree(dir: System.properties['user.home'] + '/.gradle/caches/modules-2/files-2.1', include: ['**/*.jar']))

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// ForgeGradle 1.2 hard-codes a retired S3 endpoint. The exact 1.7.10 client
// and server JARs were downloaded from Mojang and SHA-1 verified in its cache.
tasks.downloadClient.enabled = false
tasks.downloadServer.enabled = false

task mostrarClasspath << {
    println compileJava.classpath.asPath
}
// Convert only the generated copy of the decompiled sources from SRG to MCP
// names immediately before javac. Originals in codigo_mods are never touched.
compileJava.doFirst {
    def mapFile = file(System.properties['user.home'] + '/.gradle/caches/minecraft/net/minecraftforge/forge/1.7.10-10.13.4.1614-1.7.10/srgs/srg-mcp.srg')
    def nameMap = [:]
    mapFile.eachLine { line ->
        if (line.startsWith('FD: ') || line.startsWith('MD: ')) {
            def parts = line.split(' ')
            def from = parts[1].tokenize('/').last()
            def to = (line.startsWith('FD: ') ? parts[2] : parts[3]).tokenize('/').last()
            if (from != to) nameMap[from] = to
        }
    }
    fileTree(dir: "$buildDir/sources/java", include: ['**/*.java']).each { source ->
        def text = source.getText('UTF-8')
        nameMap.each { from, to -> text = text.replaceAll('\\b' + java.util.regex.Pattern.quote(from) + '\\b', to) }
if (source.name == 'MixinJRMCoreComTickH.java') {
            text = text.replace('getStackInSlot(', 'func_70301_a(').replace('decrStackSize(', 'func_70298_a(')
        }
        source.setText(text, 'UTF-8')
    }
}